<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">

<title>Master_Captura</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#fff;color:#000;font:11pt Calibri,Carlito,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button,select.tool{font:10pt Calibri,Carlito,Arial,sans-serif;color:#000;background:#fff;border:1px solid #ABABAB;border-radius:2px;padding:3px 10px;cursor:pointer}
button:hover{background:#F2F2F2}
button.pri{background:#1F4E78;border-color:#1F4E78;color:#fff;font-weight:700}
button.pri:hover{background:#2E75B6}
button:disabled{background:#D9D9D9;border-color:#D9D9D9;color:#595959;cursor:not-allowed}
#bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;background:#F2F2F2;border-bottom:1px solid #ABABAB;font-size:10pt}
#equipo{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#595959}
#saved{color:#595959;white-space:nowrap}
select.tool{max-width:230px}
#aviso{color:#843C0C;font-size:9.5pt;white-space:nowrap}
.warnbox{background:#F8CBAD;color:#843C0C;border-left:4px solid #C65911;padding:7px 10px;margin:0 0 9px}
.warnbox b{display:block;margin-bottom:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
label.modo{font-weight:700;color:#1F4E78;white-space:nowrap}
#modobar{flex:none;background:#DDEBF7;color:#1F4E78;padding:3px 8px;font-size:10pt;font-weight:700}
#tabbar{flex:none;background:#F8CBAD;color:#843C0C;padding:3px 8px;font-size:10pt;font-weight:700}
#warnbar{flex:none;background:#FFC7CE;color:#9C0006;padding:3px 8px;font-size:10pt}
#sheet{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
table.ws{border-collapse:collapse;table-layout:fixed}
table.ws thead{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 #808080}
table.ws td{border:1px solid #D4D4D4;padding:0 2px;line-height:1.15}
td.in{padding:0;cursor:cell}
td.in input,td.in select,td.in textarea{display:block;width:100%;margin:0;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:inherit;padding:1px 2px;line-height:1.15;outline:0}
td.in textarea{resize:none;overflow:hidden;height:auto;white-space:pre-wrap}
td.in select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:14px;text-overflow:ellipsis}
td.in select:focus{appearance:auto;-webkit-appearance:auto}
td.in input[type=date],td.in input[type=time]{min-width:0}
td.in:focus-within{outline:2px solid #107C41;outline-offset:-2px;position:relative;z-index:2}
td.num{text-align:right}
tr.sec{cursor:pointer}
button.tg{border:0;background:none;padding:0;margin:0 4px 0 0;width:14px;font:inherit;color:inherit;cursor:pointer}
button.tg:hover{background:none}
button.tg:focus-visible{outline:2px solid #107C41}
.secsum{font-weight:400;margin-left:10px}
.secsum.err{color:#C00000}.secsum.fal{color:#C65911}.secsum.rev{color:#2E75B6}.secsum.ok{color:#008000}
td.in input.vac:not(:focus){color:transparent}
td.in input.vac:not(:focus)::-webkit-datetime-edit{color:transparent}
td.in input.vac:not(:focus)::-webkit-calendar-picker-indicator{opacity:0}
#tip{position:fixed;z-index:30;max-width:290px;background:#FFFFE1;border:1px solid #767676;padding:4px 7px;font-size:9.5pt;line-height:1.25;box-shadow:1px 1px 3px rgba(0,0,0,.25);pointer-events:none}
#tip b{display:block}
dialog{border:1px solid #767676;border-radius:3px;padding:0;width:min(640px,calc(100vw - 24px));max-height:82vh;font-size:10.5pt}
dialog::backdrop{background:rgba(0,0,0,.2)}
.dh{background:#1F4E78;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.dh button{background:none;border:0;color:#fff;font-size:15pt;line-height:1;padding:0 3px}
.dh button:hover{background:#2E75B6}
.db{padding:10px 12px;overflow:auto;max-height:calc(82vh - 40px)}
.dr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-bottom:1px solid #D4D4D4;align-items:center}
.dr b{display:block;overflow-wrap:anywhere}
.dr small{color:#595959}
.dr .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.danger{color:#9C0006;border-color:#9C0006}
.note{color:#595959;font-size:9.5pt;margin:9px 0 0}
.iss{list-style:none;padding:0;margin:9px 0 0}
.iss button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #D4D4D4;border-radius:0;background:none;padding:4px 2px;font-size:10pt}
.iss button:hover{background:#F2F2F2}
.iss .err{color:#C00000}.iss .fal{color:#C65911}.iss .rev{color:#2E75B6}
.sum{font-weight:700;color:#1F4E78;margin:0 0 8px}
.e{color:#9C0006;margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;border:1px solid #767676;padding:6px 12px;font-size:10pt;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:40;max-width:calc(100vw - 24px)}
#toast.bad{border-color:#C00000;color:#9C0006}

efaultSlicerStyle=\"SlicerStyleLight1\"/><\/ext><ext uri=\"{9260A510-F301-46a8-8635-F512D64BE5F5}\" xmlns:x15=\"http://schemas.microsoft.com/office/spreadsheetml/2010/11/main\"><x15:timelineStyles defaultTimelineStyle=\"TimeSlicerStyleLight1\"/><\/ext><\/extLst><\/styleSheet>"],["xl/sharedStrings.xml","<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\r\n<sst xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" count=\"573\" uniqueCount=\"388\"><si><t>MASTER CAPTURA — Recipiente sujeto a presión (NOM-020-STPS)<\/t><\/si><si><t>REGLAS DE CAPTURA<\/t><\/si><si><t>Captura solo en celdas amarillas (azul). No cambies la columna A (clave de campo): la usa la macro de importación.<\/t><\/si><si><t>NA = no aplica al equipo · No disponible = aplica, pero no se consiguió. Solo en campos de texto. En números, fechas y horas no escribas texto: déjalos en blanco.<\/t><\/si><si><t>Versión<\/t><\/si><si><t>Plantilla<\/t><\/si><si><t>CAP-v1<\/t><\/si><si><t>Revisión de la captura:<\/t><\/si><si><t>Colores: rojo = error · naranja = falta · gris = va en blanco · azul = revisar<\/t><\/si><si><t>Clave<\/t><\/si><si><t>Concepto<\/t><\/si><si><t>Unidad<\/t><\/si><si><t>Valor<\/t><\/si><si><t>Nota / referencia<\/t><\/si><si><t>Cómo se captura<\/t><\/si><si><t>Revisión<\/t><\/si><si><t>1. DATOS GENERALES DEL EQUIPO<\/t><\/si><si><t>cap_Cliente<\/t><\/si><si><t>Cliente / Empresa<\/t><\/si><si><t>—<\/t><\/si><si><t>Texto · Obligatorio. Si no aplica: NA. Si no se consiguió: No disponible. Razón social completa.<\/t><\/si><si><t>cap_Ubicacion<\/t><\/si><si><t>Ubicación del equipo<\/t><\/si><si><t>Texto · Obligatorio. Si no aplica: NA. Si no se consiguió: No disponible.<\/t><\/si><si><t>cap_TAG<\/t><\/si><si><t>Identificación (TAG)<\/t><\/si><si><t>cap_NombreGen<\/t><\/si><si><t>Nombre genérico<\/t><\/si><si><t>cap_Marca<\/t><\/si><si><t>Marca / Fabricante<\/t><\/si><si><t>cap_Serie<\/t><\/si><si><t>Número de serie<\/t><\/si><si><t>cap_Anio<\/t><\/si><si><t>Año de fabricación<\/t><\/si><si><t>año<\/t><\/si><si><t>Número entero (4 cifras) · Opcional. Si no se conoce, en blanco. No debe ser posterior a la inspección.<\/t><\/si><si><t>cap_Origen<\/t><\/si><si><t>Lugar de origen<\/t><\/si><si><t>cap_Estado<\/t><\/si><si><t>Estado de uso<\/t><\/si><si><t>Lista · Obligatorio. Nuevo o Usado.<\/t><\/si><si><t>cap_Fluido<\/t><\/si><si><t>Fluido manejado<\/t><\/si><si><t>Texto · Obligatorio. Si no aplica: NA. Si no se consiguió: No disponible. Ej. Aire comprimido.<\/t><\/si><si><t>2. DATOS DE PLACA Y DISEÑO<\/t><\/si><si><t>cap_Capacidad<\/t><\/si><si><t>Capacidad volumétrica<\/t><\/si><si><t>L<\/t><\/si><si><t>Número en L · Obligatorio. Solo la cifra. Si no se consiguió, en blanco.<\/t><\/si><si><t>cap_Pdis<\/t><\/si><si><t>Presión de diseño<\/t><\/si><si><t>kPa<\/t><\/si><si><t>Se convierte a kg/cm² (÷ 98.0665).<\/t><\/si><si><t>Número en kPa · Obligatorio. Solo la cifra. Si la placa no es legible, en blanco y pide el certificado.<\/t><\/si><si><t>cap_PMP_Placa<\/t><\/si><si><t>Presión máxima permitida (placa)<\/t><\/si><si><t>Número en kPa · Opcional. En blanco si la placa no la indica. No menor que la de diseño.<\/t><\/si><si><t>cap_Tdis<\/t><\/si><si><t>Temperatura de diseño<\/t><\/si><si><t>°C<\/t><\/si><si><t>Número en °C · Obligatorio. Puede ser negativo. Si no se consiguió, en blanco.<\/t><\/si><si><t>cap_Pprueba<\/t><\/si><si><t>Presión de prueba<\/t><\/si><si><t>Número en kPa · Opcional. En blanco si no está en placa. Mayor o igual que la de diseño.<\/t><\/si><si><t>cap_Codigo<\/t><\/si><si><t>Código de construcción<\/t><\/si><si><t>Texto · Obligatorio. Si no aplica: NA. Si no se consiguió: No disponible. Ej. ASME Sección VIII, División 1.<\/t><\/si><si><t>3. DATOS DE OPERACIÓN<\/t><\/si><si><t>cap_Pop<\/t><\/si><si><t>Presión de operación<\/t><\/si><si><t>Número en kPa · Obligatorio. Menor que la presión de diseño.<\/t><\/si><si><t>cap_Top<\/t><\/si><si><t>Temperatura de operación<\/t><\/si><si><t>Número en °C · Obligatorio. Puede ser negativo.<\/t><\/si><si><t>4. GEOMETRÍA Y MATERIALES<\/t><\/si><si><t>Elemento 1<\/t><\/si><si><t>Elemento 2<\/t><\/si><si><t>Elemento 3<\/t><\/si><si><t>Elemento 4<\/t><\/si><si><t>Elemento 5<\/t><\/si><si><t>Elemento 6<\/t><\/si><si><t>cap_E_Nombre<\/t><\/si><si><t>Nombre del elemento<\/t><\/si><si><t>Texto libre: tapa, envolvente, chaqueta, etc.<\/t><\/si><si><t>Texto · Una columna por elemento, de izquierda a derecha, sin saltar. Sin nombre = no existe: toda la columna en blanco, sin NA.<\/t><\/si><si><t>cap_E_Tipo<\/t><\/si><si><t>Tipo<\/t><\/si><si><t>lista<\/t><\/si><si><t>Lista · Obligatorio en cada elemento con nombre.<\/t><\/si><si><t>cap_E_DatoMed<\/t><\/si><si><t>Dato medido para el diámetro<\/t><\/si><si><t>Perímetro exterior (cinta), Diámetro exterior o Diámetro interior.<\/t><\/si><si><t>cap_E_ValorMed<\/t><\/si><si><t>Valor medido (perímetro o diámetro)<\/t><\/si><si><t>mm<\/t><\/si><si><t>En mm. Perímetro → Do = perímetro ÷ π; luego D int = Do − 2·T.<\/t><\/si><si><t>Número en mm · Obligatorio en cada elemento. Corresponde al dato elegido arriba.<\/t><\/si><si><t>cap_E_Long<\/t><\/si><si><t>Longitud L (solo envolvente)<\/t><\/si><si><t>Número en mm · Obligatorio en cilíndricos. En tapas va en blanco, sin NA.<\/t><\/si><si><t>cap_E_AltTapa<\/t><\/si><si><t>Altura de la tapa<\/t><\/si><si><t>Opcional. Vacío = se calcula por la forma (2:1 → D/4). Captura solo la altura interior, sin la ceja recta. En cono es obligatoria.<\/t><\/si><si><t>Número en mm · Obligatorio en cónicas; opcional en elipsoidal, hemisférica y toriesférica; en blanco en cilíndricos y planas.<\/t><\/si><si><t>cap_E_EspNom<\/t><\/si><si><t>Espesor nominal<\/t><\/si><si><t>Informativo; el cálculo usa el mínimo medido.<\/t><\/si><si><t>Número en mm · Opcional. En blanco si no hay placa o plano. Sirve para revisar las lecturas UT.<\/t><\/si><si><t>cap_E_Material<\/t><\/si><si><t>Material (como viene en la hoja)<\/t><\/si><si><t>La clave ASME la asigna ingeniería en el Motor.<\/t><\/si><si><t>Texto · Obligatorio en cada elemento. Clave como aparece en placa, estampado de la tapa o documento (ej. SA-285-C). Si no hay: No disponible. Si la clave existe en la tabla ASME, Master la toma como documentada.<\/t><\/si><si><t>5. VÁLVULA DE SEGURIDAD (ALIVIO)<\/t><\/si><si><t>cap_Val_Marca<\/t><\/si><si><t>Texto · Obligatorio. Si no aplica: NA. Si no se consiguió: No disponible. Sin válvula: NA.<\/t><\/si><si><t>cap_Val_Modelo<\/t><\/si><si><t>Modelo<\/t><\/si><si><t>cap_Val_Serie<\/t><\/si><si><t>cap_Val_Pcal<\/t><\/si><si><t>Presión de calibración<\/t><\/si><si><t>kg/cm²<\/t><\/si><si><t>Número en kg/cm² · Obligatorio. Mayor que la presión de operación y no mayor que la de diseño.<\/t><\/si><si><t>cap_Val_FechaCal<\/t><\/si><si><t>Fecha de calibración<\/t><\/si><si><t>fecha<\/t><\/si><si><t>Fecha (dd/mm/aaaa) · Opcional. Si no está disponible, en blanco.<\/t><\/si><si><t>cap_Val_Orificio<\/t><\/si><si><t>Diámetro de boquilla / orificio<\/t><\/si><si><t>Número en mm · Opcional. En blanco si no se pudo medir.<\/t><\/si><si><t>6. MANÓMETRO / INSTRUMENTO DE MEDICIÓN<\/t><\/si><si><t>cap_Man_Marca<\/t><\/si><si><t>cap_Man_Modelo<\/t><\/si><si><t>cap_Man_Serie<\/t><\/si><si><t>cap_Man_Rango<\/t><\/si><si><t>Rango de medición<\/t><\/si><si><t>Texto · Obligatorio. Ej. 0–21 kg/cm² o 0–300 psi. Si no se consiguió: No disponible.<\/t><\/si><si><t>cap_Man_FechaCal<\/t><\/si><si><t>Texto o fecha · Opcional. Si no tiene: No disponible.<\/t><\/si><si><t>cap_Man_Nota<\/t><\/si><si><t>Nota<\/t><\/si><si><t>Texto · Opcional. En blanco si no hay nota.<\/t><\/si><si><t>7. MEDICIÓN DE ESPESORES (UT) — una lectura por renglón<\/t><\/si><si><t>Lecturas UT: número en mm, una por renglón, solo en elementos con nombre. Sin lectura: en blanco, sin NA.<\/t><\/si><si><t>cap_UT01<\/t><\/si><si><t>Lectura 1<\/t><\/si><si><t>Tapas: 0° · Envolvente: Sección 1 – 0°<\/t><\/si><si><t>Número en mm · Solo en elementos con nombre. Se marca si es menor que la mitad o mayor que 1.5 veces el espesor nominal.<\/t><\/si><si><t>cap_UT02<\/t><\/si><si><t>Lectura 2<\/t><\/si><si><t>Tapas: 90° · Envolvente: Sección 1 – 90°<\/t><\/si><si><t>cap_UT03<\/t><\/si><si><t>Lectura 3<\/t><\/si><si><t>Tapas: 180° · Envolvente: Sección 1 – 180°<\/t><\/si><si><t>cap_UT04<\/t><\/si><si><t>Lectura 4<\/t><\/si><si><t>Tapas: 270° · Envolvente: Sección 1 – 270°<\/t><\/si><si><t>cap_UT05<\/t><\/si><si><t>Lectura 5<\/t><\/si><si><t>Envolvente: Sección 2 – 0°<\/t><\/si><si><t>cap_UT06<\/t><\/si><si><t>Lectura 6<\/t><\/si><si><t>Envolvente: Sección 2 – 90°<\/t><\/si><si><t>cap_UT07<\/t><\/si><si><t>Lectura 7<\/t><\/si><si><t>Envolvente: Sección 2 – 180°<\/t><\/si><si><t>cap_UT08<\/t><\/si><si><t>Lectura 8<\/t><\/si><si><t>Envolvente: Sección 2 – 270°<\/t><\/si><si><t>cap_UT09<\/t><\/si><si><t>Lectura 9<\/t><\/si><si><t>Envolvente: Sección 3 – 0°<\/t><\/si><si><t>cap_UT10<\/t><\/si><si><t>Lectura 10<\/t><\/si><si><t>Envolvente: Sección 3 – 90°<\/t><\/si><si><t>cap_UT11<\/t><\/si><si><t>Lectura 11<\/t><\/si><si><t>Envolvente: Sección 3 – 180°<\/t><\/si><si><t>cap_UT12<\/t><\/si><si><t>Lectura 12<\/t><\/si><si><t>Envolvente: Sección 3 – 270°<\/t><\/si><si><t>cap_UT13<\/t><\/si><si><t>Lectura 13<\/t><\/si><si><t>cap_UT14<\/t><\/si><si><t>Lectura 14<\/t><\/si><si><t>cap_UT15<\/t><\/si><si><t>Lectura 15<\/t><\/si><si><t>cap_UT16<\/t><\/si><si><t>Lectura 16<\/t><\/si><si><t>cap_UT17<\/t><\/si><si><t>Lectura 17<\/t><\/si><si><t>cap_UT18<\/t><\/si><si><t>Lectura 18<\/t><\/si><si><t>cap_UT19<\/t><\/si><si><t>Lectura 19<\/t><\/si><si><t>cap_UT20<\/t><\/si><si><t>Lectura 20<\/t><\/si><si><t>8. CENTRO DE TRABAJO Y USUARIO<\/t><\/si><si><t>cap_Domicilio<\/t><\/si><si><t>Domicilio del usuario<\/t><\/si><si><t>Texto · Obligatorio. Calle, número, colonia, C.P., municipio y estado.<\/t><\/si><si><t>cap_Actividad<\/t><\/si><si><t>Actividad del centro de trabajo<\/t><\/si><si><t>Texto · Obligatorio.<\/t><\/si><si><t>9. INSPECCIÓN Y EMISIÓN<\/t><\/si><si><t>cap_Folio<\/t><\/si><si><t>Número de expediente<\/t><\/si><si><t>Folio del trabajo. Arma los folios: …-MEM, …-UT, …-PM.<\/t><\/si><si><t>Texto · Obligatorio. Ej. EA-2610-020-0151. En lote se asigna solo si va en blanco.<\/t><\/si><si><t>cap_FechaInsp<\/t><\/si><si><t>Fecha de inspección (prueba END)<\/t><\/si><si><t>Fecha en campo. Aparece en el informe END.<\/t><\/si><si><t>Fecha (dd/mm/aaaa) · Obligatorio.<\/t><\/si><si><t>cap_FechaEmision<\/t><\/si><si><t>Fecha de emisión (memoria e informe)<\/t><\/si><si><t>Fecha de los documentos; define los folios MEM-UT y END-UT.<\/t><\/si><si><t>Fecha (dd/mm/aaaa) · Obligatorio. Igual o posterior a la de inspección.<\/t><\/si><si><t>cap_HoraIni<\/t><\/si><si><t>Hora de inicio de la inspección<\/t><\/si><si><t>hh:mm<\/t><\/si><si><t>Hora (hh:mm) · Obligatorio.<\/t><\/si><si><t>cap_HoraFin<\/t><\/si><si><t>Hora de término de la inspección<\/t><\/si><si><t>Hora (hh:mm) · Obligatorio. Posterior a la de inicio.<\/t><\/si><si><t>cap_CondServicio<\/t><\/si><si><t>Condición de servicio<\/t><\/si><si><t>Ej. En operación / Fuera de operación.<\/t><\/si><si><t>Lista · Obligatorio. En operación o Fuera de operación.<\/t><\/si><si><t>cap_Acabado<\/t><\/si><si><t>Acabado superficial<\/t><\/si><si><t>Ej. Con pintura / Metal desnudo.<\/t><\/si><si><t>Lista · Obligatorio. Con pintura o Metal desnudo; si es otro, escríbelo.<\/t><\/si><si><t>cap_ObsEND<\/t><\/si><si><t>Observaciones del informe END<\/t><\/si><si><t>Vacío = «Sin observaciones».<\/t><\/si><si><t>Texto · Opcional. En blanco = «Sin observaciones».<\/t><\/si><si><t>10. EXPEDIENTE NOM-020 (DATOS DEL EQUIPO Y OPERACIÓN)<\/t><\/si><si><t>cap_Categoria<\/t><\/si><si><t>Categoría<\/t><\/si><si><t>Lista · Obligatorio. I, II o III. Se revisa contra tipo de fluido (D99), presión de calibración (D45) y capacidad (D19) según Tabla 1 de la NOM-020.<\/t><\/si><si><t>cap_ControlSTPS<\/t><\/si><si><t>Número de control STPS<\/t><\/si><si><t>Vacío = en trámite.<\/t><\/si><si><t>Texto · Opcional. En blanco = en trámite. No escribas NA.<\/t><\/si><si><t>cap_Certificado<\/t><\/si><si><t>Certificado de construcción<\/t><\/si><si><t>«No existe» o folio.<\/t><\/si><si><t>Texto · Obligatorio. Folio del certificado o «No existe».<\/t><\/si><si><t>cap_Descripcion<\/t><\/si><si><t>Descripción del recipiente<\/t><\/si><si><t>Para títulos de plano, croquis y memoria.<\/t><\/si><si><t>Texto · Obligatorio. Ej. Tanque recibidor de aire vertical.<\/t><\/si><si><t>cap_Riesgo<\/t><\/si><si><t>Tipo de riesgo del fluido<\/t><\/si><si><t>Lista · Obligatorio. No peligroso (agua, aire u otro) o Peligroso, según la definición de fluido peligroso de la NOM-020.<\/t><\/si><si><t>cap_TipoRelevo<\/t><\/si><si><t>Tipo de dispositivo de relevo<\/t><\/si><si><t>Lista · Obligatorio. Válvula de seguridad, de alivio o disco de ruptura; si es otro, escríbelo.<\/t><\/si><si><t>cap_NumRelevo<\/t><\/si><si><t>Número de dispositivos de relevo<\/t><\/si><si><t>Número entero · Obligatorio (1 o más).<\/t><\/si><si><t>cap_DescOperacion<\/t><\/si><si><t>Descripción breve de la operación<\/t><\/si><si><t>Texto · Obligatorio. Breve, una o dos líneas.<\/t><\/si><si><t>cap_PArranque<\/t><\/si><si><t>Presión de arranque<\/t><\/si><si><t>Debe ser menor que la calibración de la válvula.<\/t><\/si><si><t>Número en kg/cm² · Obligatorio. Menor que la presión de paro.<\/t><\/si><si><t>cap_PParo<\/t><\/si><si><t>Presión de paro<\/t><\/si><si><t>Número en kg/cm² · Obligatorio. Mayor que la de arranque y menor que la calibración de la válvula.<\/t><\/si><si><t>cap_UltRevision<\/t><\/si><si><t>Última revisión / mantenimiento — fecha<\/t><\/si><si><t>Texto o fecha · Obligatorio. Si no se conoce: No disponible.<\/t><\/si><si><t>cap_ElemRevisado<\/t><\/si><si><t>Elemento revisado y/o mantenimiento<\/t><\/si><si><t>cap_RespMant<\/t><\/si><si><t>Responsable de mantenimiento<\/t><\/si><si><t>cap_Modificaciones<\/t><\/si><si><t>Modificaciones y alteraciones<\/t><\/si><si><t>Texto · Obligatorio. «No» o la descripción.<\/t><\/si><si><t>cap_Reparaciones<\/t><\/si><     btn.setAttribute('aria-label', (on ? 'Expandir' : 'Contraer') + ' sección ' + n);
  }
  function foldAll(on) { SECS.forEach(function (s, i) { setFold(i, on); }); refreshSums(); }
  function refreshSums() {
    var by = {};
    issues().forEach(function (x) { var b = by[x.s.n] = by[x.s.n] || { err: 0, fal: 0, rev: 0 }; b[x.lv]++; });
    SECS.forEach(function (s) {
      var e = $('sum' + s.n), b = by[s.n];
      if (!folded[s.n]) { e.textContent = ''; return; }
      if (!b) {
        var ev = effVals(), filled = s.rows.some(function (r) { return r.cells && Object.keys(r.cells).some(function (c) { return (ev[c + r.r] || '').trim(); }); });
        e.className = 'secsum' + (filled ? ' ok' : ''); e.style.color = filled ? '' : '#808080';
        e.textContent = filled ? '✔ sin pendientes' : '— en blanco'; return;
      }
      e.style.color = '';
      e.className = 'secsum ' + (b.err ? 'err' : b.fal ? 'fal' : 'rev');
      e.textContent = [b.err && b.err + ' con error', b.fal && b.fal + ' por capturar', b.rev && b.rev + ' por revisar'].filter(Boolean).join(' · ');
    });
  }
  function initFolds() {
    SECS.forEach(function (s, i) {
      var td = $('td_B' + s.hr), tr = $('r' + s.hr);
      tr.classList.add('sec'); tr.setAttribute('data-sec', i);
      td.innerHTML = '<button type="button" class="tg" id="tg' + s.n + '"></button>' + td.innerHTML + '<span class="secsum" id="sum' + s.n + '"></span>';
      setFold(i, true);
    });
  }
  function buildJump() {
    $('jump').innerHTML = '<option value="">Ir a sección…</option>' + SECS.map(function (s, i) { return nuevo() && SECEXCL[i] ? '' : '<option value="' + s.hr + '">' + s.n + '. ' + h(s.title) + '</option>'; }).join('');
  }
  function setModoUI() {
    $('modo').value = modo;
    $('modobar').hidden = !nuevo();
    $('modobar').textContent = 'Equipo nuevo sin pruebas: solo se muestran y se exportan los ' + NUEVO_N + ' datos que el Motor importa para equipo nuevo. Lo demás va en blanco en el Excel.';
    buildJump();
    SECS.forEach(function (s, i) { applyRows(i); });
  }
  function setModo(m) { modo = normModo(m); setModoUI(); refresh(); touch(); }
  $('modo').onchange = function () {
    var m = this.value;
    if (m !== 'nuevo') { setModo(m); return; }
    var n = Object.keys(vals).filter(function (c) { return EXCLROW[rowNum(c)] && (vals[c] || '').trim(); }).length;
    if (!n) { setModo(m); return; }
    showDialog('Cambiar a equipo nuevo sin pruebas', '<div class="warnbox"><b>Hay ' + n + ' dato(s) capturado(s) que no aplican a equipo nuevo.</b>Por ejemplo, lecturas UT, elementos, zonas o fechas de inspección. Se ocultan y no se exportan al Excel; se conservan en el borrador por si vuelves a «Con pruebas».</div><div class="btns"><button class="pri" data-d="modoOK" data-m="nuevo">Cambiar</button><button data-d="modoNo">Cancelar</button></div>');
  };
  function revealRow(r) {
    SECS.forEach(function (s, i) { var g = secRange(i); if (r >= s.hr && r <= g[1] && folded[s.n]) { setFold(i, false); refreshSums(); } });
  }
  function goRow(r, focus) {
    revealRow(+r);
    var tr = $('r' + r), sh = $('sheet'), th = sh.querySelector('thead');
    if (tr) sh.scrollTop = tr.offsetTop - th.offsetHeight - 2;
    if (focus && $('c_' + focus)) $('c_' + focus).focus({ preventScroll: true });
  }

  /* ---------- Diálogos ---------- */
  function showDialog(title, html) { $('dlgT').textContent = title; $('dlgB').innerHTML = html; if (!$('dlg').open) $('dlg').showModal(); }
  function closeDialog() {
    $('dlg').close();
    if (pendingRestore) { var el = pendingRestore, c = el.getAttribute('data-c'); pendingRestore = null; el.value = vals[c] || ''; grow(el); el.focus(); }
  }
  $('dlg').addEventListener('close', function () { $('modo').value = modo; if (pendingRestore) closeDialog(); });
  $('dlgX').onclick = closeDialog;
  function drawDrafts() {
    var ids = Object.keys(drafts).sort(function (a, b) { return drafts[b].upd.localeCompare(drafts[a].upd); });
    showDialog('Borradores en este navegador', '<p class="btns" style="margin:0 0 6px"><button class="pri" data-d="new" data-m="completo">Nuevo · con pruebas</button><button class="pri" data-d="new" data-m="nuevo">Nuevo · equipo nuevo sin pruebas</button></p>' + ids.map(function (id) {
      var d = drafts[id];
      return '<div class="dr"><div><b>' + h(draftName(d.v)) + '</b><small>' + (d.modo === 'nuevo' ? 'Equipo nuevo sin pruebas · ' : '') + (id === cur ? 'Abierto · ' : '') + new Date(d.upd).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) + '</small></div><div class="acts">' +
        (id === cur ? '' : '<button data-d="open" data-id="' + id + '">Abrir</button>') +
        '<button data-d="dup" data-id="' + id + '" title="Copia para otro equipo del mismo cliente">Duplicar</button>' +
        '<button data-d="del" data-id="' + id + '">Eliminar</button></div></div>';
    }).join('') + '<p class="note">Los datos se quedan en este navegador: no se envían a ningún servidor. Si limpias sus datos se pierden; guarda un JSON de lo importante o para pasar a otro equipo.</p>');
  }
  function drawGenerate() {
    compute();
    var is = issues(), n = { err: 0, fal: 0, rev: 0 };
    is.forEach(function (i) { n[i.lv]++; });
    var list = is.map(function (i) { return '<li><button data-d="go" data-row="' + i.r + '">Fila ' + i.r + ' · ' + h(i.label) + ' — <span class="' + i.lv + '">' + h(i.st) + '</span></button></li>'; }).join('');
    showDialog('Generar master_captura.xlsx', '<p class="sum">' + n.err + ' errores · ' + n.fal + ' faltantes · ' + n.rev + ' por revisar</p>' +
      (nuevo() ? '<p class="note" style="margin:0 0 8px">Equipo nuevo sin pruebas: el Excel lleva solo los datos que importa el Motor; las demás celdas van en blanco.</p>' : '') +
      (n.err ? '<p class="e">Corrige los errores para generar el Excel.</p>' : (n.fal || n.rev) ? '<div class="warnbox"><b>Advertencia: la captura no está completa.</b>Si generas el Excel ahora, los pendientes quedarán marcados en la columna «Revisión» y la macro los encontrará al importar.</div>' : '') +
      '<button class="pri" data-d="gen"' + (n.err ? ' disabled' : '') + '>' + (!n.err && (n.fal || n.rev) ? 'Generar de todos modos' : 'Generar Excel') + '</button>' + (list ? '<ul class="iss">' + list + '</ul>' : ''));
  }
  $('dlgB').addEventListener('click', function (e) {
    var t = e.target.closest('button[data-d]');
    if (!t) return;
    var a = t.getAttribute('data-d'), id = t.getAttribute('data-id'), n;
    if (a === 'closeErr') closeDialog();
    if (a === 'modoOK') { $('dlg').close(); setModo(t.getAttribute('data-m')); return; }
    if (a === 'modoNo') { $('dlg').close(); $('modo').value = modo; return; }
    if (a === 'new') { n = uid(); drafts[n] = { id: n, upd: new Date().toISOString(), v: {}, modo: normModo(t.getAttribute('data-m')) }; $('dlg').close(); openDraft(n); }
    if (a === 'open') { $('dlg').close(); openDraft(id); }
    if (a === 'dup') {
      showDialog('Duplicar borrador', '<div class="warnbox"><b>Se copiará todo, también las mediciones del equipo original.</b>Antes de generar el Excel, actualiza TAG, serie, espesores, evidencia de material y fechas del nuevo equipo.</div><p style="margin:0">' + h(draftName(drafts[id].v)) + '</p><div class="btns"><button class="pri" data-d="dupOK" data-id="' + id + '">Duplicar</button><button data-d="dupNo">Cancelar</button></div>');
      return;
    }
    if (a === 'dupNo') { drawDrafts(); return; }
    if (a === 'dupOK') { n = uid(); drafts[n] = { id: n, upd: new Date().toISOString(), v: JSON.parse(JSON.stringify(drafts[id].v)), modo: drafts[id].modo }; $('dlg').close(); openDraft(n); toast('Copia creada. Actualiza TAG, serie y mediciones del nuevo equipo.'); }
    if (a === 'del') {
      if (t.getAttribute('data-sure') !== '1') { t.setAttribute('data-sure', '1'); t.textContent = '¿Seguro?'; t.classList.add('danger'); return; }
      delete drafts[id];
      if (id === cur) {
        var rest = Object.keys(drafts);
        if (rest.length) cur = rest[0]; else { cur = uid(); drafts[cur] = { id: cur, upd: new Date().toISOString(), v: {} }; }
        writeStore(); vals = MC.fromDraft(drafts[cur].v).vals; modo = normModo(drafts[cur].modo); setModoUI(); fillAll();
      } else writeStore();
      drawDrafts();
    }
    if (a === 'go') {
      var r = t.getAttribute('data-row'), rr = MC.rowOf[r], target = 'D' + r;
      if (rr && rr.cells) Object.keys(rr.cells).some(function (cc) { if (!(vals[cc + r] || '').trim()) { target = cc + r; return true; } });
      $('dlg').close(); goRow(r, target);
    }
    if (a === 'gen') {
      saveNow();
      download('master_captura_' + baseName() + '.xlsx', MC.buildXlsx(effVals()), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      $('dlg').close(); toast('Excel generado.');
    }
  });
  $('bExpand').onclick = function () { foldAll(false); };
  $('bCollapse').onclick = function () { commitActive(); if (!pendingRestore) foldAll(true); };
  $('bSave').onclick = saveJSON;
  $('bOpen').onclick = function () { $('file').value = ''; $('file').click(); };
  $('file').onchange = function () { if (this.files[0]) openJSON(this.files[0]); };
  $('bGen').onclick = function () { commitActive(); if (!pendingRestore) drawGenerate(); };
  $('bDrafts').onclick = function () { commitActive(); if (pendingRestore) return; saveNow(); syncStore(); drawDrafts(); };
  $('jump').onchange = function () { if (this.value) goRow(+this.value); this.value = ''; };
  window.addEventListener('beforeunload', function () { commitActive(); if (saveT) saveNow(); });

  /* ---------- Otra pestaña abierta: el navegador libera el candado solo al cerrarla ---------- */
  (function () {
    if (!navigator.locks || !navigator.locks.request) return;
    var name = 'mc_tab_' + uid();
    navigator.locks.request(name, function () { return new Promise(function () {}); });
    function check() {
      navigator.locks.query().then(function (q) {
        $('tabbar').hidden = q.held.filter(function (l) { return l.name.indexOf('mc_tab_') === 0; }).length < 2;
      });
    }
    setInterval(check, 3000);
    document.addEventListener('visibilitychange', check);
    setTimeout(check, 300);
  })();

  /* ---------- Arranque ---------- */
  readStore();
  if (!storageOK) $('warnbar').hidden = false;
  if (!cur || !drafts[cur]) {
    var ids = Object.keys(drafts).sort(function (a, b) { return drafts[b].upd.localeCompare(drafts[a].upd); });
    cur = ids[0] || uid();
    if (!drafts[cur]) drafts[cur] = { id: cur, upd: new Date().toISOString(), v: {} };
    writeStore();
  }
  vals = MC.fromDraft(drafts[cur].v).vals;
  modo = normModo(drafts[cur].modo);
  renderSheet();
  initFolds();
  setModoUI();
  fillAll();
})();
</script>
</body>
</html>
