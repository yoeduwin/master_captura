<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master_Captura</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#fff;color:#000;font:11pt Calibri,Carlito,Arial,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button,select.tool{font:10pt Calibri,Carlito,Arial,sans-serif;color:#000;background:#fff;border:1px solid #ABABAB;border-radius:2px;padding:3px 10px;cursor:pointer}
button:hover{background:#F2F2F2}
button.pri{background:#1F4E78;border-color:#1F4E78;color:#fff;font-weight:700}
button.pri:hover{background:#2E75B6}
button:disabled{background:#D9D9D9;border-color:#D9D9D9;color:#595959;cursor:not-allowed}
#bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;background:#F2F2F2;border-bottom:1px solid #ABABAB;font-size:10pt}
#equipo{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#595959}
#saved{color:#595959;white-space:nowrap}
select.tool{max-width:230px}
#aviso{color:#843C0C;font-size:9.5pt;white-space:nowrap}
.warnbox{background:#F8CBAD;color:#843C0C;border-left:4px solid #C65911;padding:7px 10px;margin:0 0 9px}
.warnbox b{display:block;margin-bottom:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tipo{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tipo>span{font-weight:700;color:#1F4E78}
.seg{display:inline-flex;border:1px solid #1F4E78;border-radius:3px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;background:#fff;color:#1F4E78;padding:3px 11px;font-weight:400}
.seg button+button{border-left:1px solid #1F4E78}
.seg button:hover{background:#DDEBF7}
.seg button[aria-checked=true]{background:#1F4E78;color:#fff;font-weight:700}
.seg button[aria-checked=true]::before{content:"✓ "}
.seg button:focus-visible{outline:2px solid #107C41;outline-offset:-3px}
#modobar{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:#DDEBF7;color:#1F4E78;border-bottom:1px solid #9DC3E6;padding:4px 8px;font-size:10pt}
#modobar b{font-weight:700}
#modobar span{color:#2F5597}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 8px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;border:1px solid #ABABAB;border-radius:4px;background:#fff;padding:12px 13px;font-size:10pt;line-height:1.3;cursor:pointer}
.pick button:hover{border-color:#2E75B6;background:#F3F8FC}
.pick button:focus-visible{outline:2px solid #107C41;outline-offset:1px}
.pick .t{font-size:12pt;font-weight:700;color:#1F4E78}
.pick .n{display:inline-block;background:#1F4E78;color:#fff;border-radius:9px;padding:0 8px;font-size:9pt;font-weight:700}
.pick .d{color:#404040}
.pick .x{color:#7F7F7F;font-size:9pt}
.tag{display:inline-block;font-size:8.5pt;line-height:1.5;padding:0 7px;border-radius:9px;background:#F2F2F2;color:#595959;margin-right:6px;vertical-align:1px}
.tag.nuevo{background:#DDEBF7;color:#1F4E78;font-weight:700}
@media (max-width:620px){.pick{grid-template-columns:1fr}.tipo>span{display:none}}
#tabbar{flex:none;background:#F8CBAD;color:#843C0C;padding:3px 8px;font-size:10pt;font-weight:700}
#warnbar{flex:none;background:#FFC7CE;color:#9C0006;padding:3px 8px;font-size:10pt}
#sheet{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
table.ws{border-collapse:collapse;table-layout:fixed}
table.ws thead{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 #808080}
table.ws td{border:1px solid #D4D4D4;padding:0 2px;line-height:1.15}
td.in{padding:0;cursor:cell}
td.in input,td.in select,td.in textarea{display:block;width:100%;margin:0;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:inherit;padding:1px 2px;line-height:1.15;outline:0}
td.in textarea{resize:none;overflow:hidden;height:auto;white-space:pre-wrap}
td.in select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:14px;text-overflow:ellipsis}
td.in select:focus{appearance:auto;-webkit-appearance:auto}
td.in input[type=date],td.in input[type=time]{min-width:0}
td.in:focus-within{outline:2px solid #107C41;outline-offset:-2px;position:relative;z-index:2}
td.num{text-align:right}
tr.sec{cursor:pointer}
button.tg{border:0;background:none;padding:0;margin:0 4px 0 0;width:14px;font:inherit;color:inherit;cursor:pointer}
button.tg:hover{background:none}
button.tg:focus-visible{outline:2px solid #107C41}
.secsum{font-weight:400;margin-left:10px}
.secsum.err{color:#C00000}.secsum.fal{color:#C65911}.secsum.rev{color:#2E75B6}.secsum.ok{color:#008000}
td.in input.vac:not(:focus){color:transparent}
td.in input.vac:not(:focus)::-webkit-datetime-edit{color:transparent}
td.in input.vac:not(:focus)::-webkit-calendar-picker-indicator{opacity:0}
#tip{position:fixed;z-index:30;max-width:290px;background:#FFFFE1;border:1px solid #767676;padding:4px 7px;font-size:9.5pt;line-height:1.25;box-shadow:1px 1px 3px rgba(0,0,0,.25);pointer-events:none}
#tip b{display:block}
dialog{border:1px solid #767676;border-radius:3px;padding:0;width:min(640px,calc(100vw - 24px));max-height:82vh;font-size:10.5pt}
dialog::backdrop{background:rgba(0,0,0,.2)}
.dh{background:#1F4E78;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.dh button{background:none;border:0;color:#fff;font-size:15pt;line-height:1;padding:0 3px}
.dh button:hover{background:#2E75B6}
.db{padding:10px 12px;overflow:auto;max-height:calc(82vh - 40px)}
.dr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-bottom:1px solid #D4D4D4;align-items:center}
.dr b{display:block;overflow-wrap:anywhere}
.dr small{color:#595959}
.dr .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.danger{color:#9C0006;border-color:#9C0006}
.note{color:#595959;font-size:9.5pt;margin:9px 0 0}
.iss{list-style:none;padding:0;margin:9px 0 0}
.iss button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #D4D4D4;border-radius:0;background:none;padding:4px 2px;font-size:10pt}
.iss button:hover{background:#F2F2F2}
.iss .err{color:#C00000}.iss .fal{color:#C65911}.iss .rev{color:#2E75B6}
.sum{font-weight:700;color:#1F4E78;margin:0 0 8px}
.e{color:#9C0006;margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;border:1px solid #767676;padding:6px 12px;font-size:10pt;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:40;max-width:calc(100vw - 24px)}
#toast.bad{border-color:#C00000;color:#9C0006}
__SHEET_CSS__
</style>
</head>
<body>

 <div class="tipo"><span id="tipoLbl">Tipo de equipo</span><div class="seg" id="seg" role="radiogroup" aria-labelledby="tipoLbl"><button type="button" role="radio" data-modo="completo" aria-checked="true">Con pruebas</button><button type="button" role="radio" data-modo="nuevo" aria-checked="false">Equipo nuevo sin pruebas</button></div></div>
 <select class="tool" id="jump" aria-label="Ir a sección"></select>
 <button id="bExpand" title="Muestra todas las secciones">Expandir todo</button>
 <button id="bCollapse" title="Oculta el contenido de todas las secciones">Contraer todo</button>
 <button id="bDrafts">Borradores</button>
 <button id="bSave" title="Descarga el borrador como archivo JSON">Guardar JSON</button>
 <button id="bOpen" title="Abre un borrador JSON guardado antes">Abrir JSON</button>
 <button id="bGen" class="pri">Generar Excel</button>
 <span id="equipo"></span>
 <span id="aviso">Se guarda solo en este navegador. Usa «Guardar JSON» para respaldar.</span>
 <span id="saved"></span>
</div>
<div id="warnbar" hidden>Este navegador no permite guardar automáticamente. Usa «Guardar JSON» para no perder la captura.</div>
<div id="modobar" hidden></div>
<div id="tabbar" hidden>Esta captura está abierta en otra pestaña. Trabaja en una sola para no sobrescribir lo capturado.</div>
<div id="sheet"></div>
<div id="tip" hidden></div>
<dialog id="dlg"><div class="dh"><span id="dlgT"></span><button id="dlgX" aria-label="Cerrar">×</button></div><div class="db" id="dlgB"></div></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast" hidden role="status"></div>

    var c = e.target.getAttribute && e.target.getAttribute('data-c');
    if (!c) return;
    var sp = MC.cellSpec[c];
    if (sp.nf) { e.target.value = vals[c] || ''; }
    var tip = $('tip');
    if (sp.p) {
      tip.innerHTML = (sp.pt ? '<b>' + h(sp.pt) + '</b>' : '') + h(sp.p); tip.hidden = false;
      var b = $('td_' + c).getBoundingClientRect(), w = tip.offsetWidth, ht = tip.offsetHeight;
      var left = Math.min(Math.max(4, b.left + 8), innerWidth - w - 4), top = b.bottom + 3;
      if (top + ht > innerHeight - 4) top = Math.max(4, b.top - ht - 3);
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    } else tip.hidden = true;
  });
  document.addEventListener('focusout', function (e) {
    var c = e.target.getAttribute && e.target.getAttribute('data-c');
    if (!c) return;
    $('tip').hidden = true;
    if (MC.cellSpec[c].nf && !pendingRestore) e.target.value = display(c);
  });
  document.addEventListener('keydown', function (e) {
    var el = e.target, c = el.getAttribute && el.getAttribute('data-c');
    if (!c || e.key !== 'Enter' || el.tagName === 'SELECT') return;
    if (el.tagName === 'TEXTAREA' && e.altKey) {
      e.preventDefault();
      var s = el.selectionStart; el.value = el.value.slice(0, s) + '\n' + el.value.slice(el.selectionEnd); el.selectionStart = el.selectionEnd = s + 1; grow(el); return;
    }
    e.preventDefault();
    var m = /^([A-Z]+)(\d+)$/.exec(c), r = +m[2], step = e.shiftKey ? -1 : 1, nx;
    el.blur();
    if (pendingRestore) return;
    for (var i = 1; i <= 160; i++) { nx = $('c_' + m[1] + (r + step * i)); if (nx && nx.offsetParent) { nx.focus(); return; } }
  });
  $('sheet').addEventListener('click', function (e) {
    var sec = e.target.closest && e.target.closest('tr.sec');
    if (sec) { var si = +sec.getAttribute('data-sec'); setFold(si, !folded[SECS[si].n]); refreshSums(); return; }
    var td = e.target.closest && e.target.closest('td.in');
    if (td && e.target === td) td.querySelector('[data-c]').focus();
  });
  /* ---------- Expandir y contraer: solo cambia la vista, nunca los datos ni el Excel ---------- */
  function secRange(i) {
    var last = i + 1 < SECS.length ? SECS[i + 1].hr - 1 : META.grid.rows[META.grid.rows.length - 1].r;
    return [SECS[i].hr + 1, last];
  }
  function applyRows(i) {
    var s = SECS[i], range = secRange(i), off = nuevo() && SECEXCL[i];
    for (var r = s.hr; r <= range[1]; r++) {
      var tr = $('r' + r);
      if (!tr) continue;
      var hid = off || (r > s.hr && (!!folded[s.n] || (nuevo() && !!EXCLROW[r])));
      if (tr.hidden && !hid) { tr.hidden = false; tr.querySelectorAll('textarea').forEach(grow); }
      else tr.hidden = hid;
    }
  }
  function setFold(i, on) {
    var n = SECS[i].n, btn = $('tg' + n);
    if (on) folded[n] = 1; else delete folded[n];
    applyRows(i);
    btn.textContent = on ? '▸' : '▾';
    btn.setAttribute('aria-expanded', String(!on));
    btn.setAttribute('aria-label', (on ? 'Expandir' : 'Contraer') + ' sección ' + n);
  }
  function foldAll(on) { SECS.forEach(function (s, i) { setFold(i, on); }); refreshSums(); }
  function refreshSums() {
    var by = {};
    issues().forEach(function (x) { var b = by[x.s.n] = by[x.s.n] || { err: 0, fal: 0, rev: 0 }; b[x.lv]++; });
    SECS.forEach(function (s) {
      var e = $('sum' + s.n), b = by[s.n];
      if (!folded[s.n]) { e.textContent = ''; return; }
      if (!b) {
        var ev = effVals(), filled = s.rows.some(function (r) { return r.cells && Object.keys(r.cells).some(function (c) { return (ev[c + r.r] || '').trim(); }); });
        e.className = 'secsum' + (filled ? ' ok' : ''); e.style.color = filled ? '' : '#808080';
        e.textContent = filled ? '✔ sin pendientes' : '— en blanco'; return;
      }
      e.style.color = '';
      e.className = 'secsum ' + (b.err ? 'err' : b.fal ? 'fal' : 'rev');
      e.textContent = [b.err && b.err + ' con error', b.fal && b.fal + ' por capturar', b.rev && b.rev + ' por revisar'].filter(Boolean).join(' · ');
    });
  }
  function initFolds() {
    SECS.forEach(function (s, i) {
      var td = $('td_B' + s.hr), tr = $('r' + s.hr);
      tr.classList.add('sec'); tr.setAttribute('data-sec', i);
      td.innerHTML = '<button type="button" class="tg" id="tg' + s.n + '"></button>' + td.innerHTML + '<span class="secsum" id="sum' + s.n + '"></span>';
      setFold(i, true);
    });
  }
  function buildJump() {
    $('jump').innerHTML = '<option value="">Ir a sección…</option>' + SECS.map(function (s, i) { return nuevo() && SECEXCL[i] ? '' : '<option value="' + s.hr + '">' + s.n + '. ' + h(s.title) + '</option>'; }).join('');
  }
  function setModoUI() {
    paintSeg();
    $('modobar').hidden = !nuevo();
    $('modobar').innerHTML = '<b>Equipo nuevo sin pruebas · ' + NUEVO_N + ' de ' + TOTAL_N + ' datos</b><span>Solo ves y se exporta lo que el Motor importa para equipo nuevo. Geometría, espesores UT, partículas magnéticas, evidencia y fechas de inspección van en blanco.</span>';
    buildJump();
    SECS.forEach(function (s, i) { applyRows(i); });
  }
  function setModo(m) { modo = normModo(m); setModoUI(); refresh(); touch(); }
  function requestModo(m) {
    if (m === modo) return;
    if (m !== 'nuevo') { setModo(m); return; }
    var n = Object.keys(vals).filter(function (c) { return EXCLROW[rowNum(c)] && (vals[c] || '').trim(); }).length;
    if (!n) { setModo(m); return; }
    showDialog('Cambiar a equipo nuevo sin pruebas', '<div class="warnbox"><b>Hay ' + n + ' dato(s) capturado(s) que no aplican a equipo nuevo.</b>Por ejemplo, lecturas UT, elementos, zonas o fechas de inspección. Se ocultan y no se exportan al Excel; se conservan en el borrador por si vuelves a «Con pruebas».</div><div class="btns"><button class="pri" data-d="modoOK" data-m="nuevo">Cambiar a equipo nuevo</button><button data-d="modoNo">Cancelar</button></div>');
  }
  $('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-modo]');
    if (!b) return;
    commitActive();
    if (!pendingRestore) requestModo(b.getAttribute('data-modo'));
  });
  $('seg').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    var bs = [].slice.call(document.querySelectorAll('#seg button')), i = bs.indexOf(document.activeElement), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + bs.length) % bs.length;
    bs[j].focus();
  });
  /* Al empezar un borrador se elige el tipo de equipo; en uno nuevo no se puede saltar. */
  function drawChooser(paraNuevo) {
    chooser = paraNuevo ? 'nuevo' : 'inicio';
    $('dlgX').hidden = !paraNuevo;
    function card(m, t, d, x, n) {
      return '<button type="button" data-d="pick" data-m="' + m + '"><span class="t">' + t + '</span><span class="n">' + n + ' datos</span><span class="d">' + d + '</span><span class="x">' + x + '</span></button>';
    }
    showDialog(paraNuevo ? 'Nuevo borrador: ¿qué equipo vas a capturar?' : '¿Qué equipo vas a capturar?',
      '<div class="pick">' +
      card('completo', 'Equipo con pruebas', 'Inspección completa en campo: placa, operación, expediente y condiciones de seguridad, más geometría, espesores UT, partículas magnéticas y evidencia de material.', 'La hoja completa, como en Excel.', TOTAL_N) +
      card('nuevo', 'Equipo nuevo sin pruebas', 'Solo lo que el Motor importa para un equipo nuevo: placa, operación, válvula, manómetro, expediente NOM-020 y condiciones de seguridad.', 'Sin geometría, espesores UT, partículas magnéticas, evidencia ni fechas de inspección.', NUEVO_N) +
      '</div><p class="note">Puedes cambiarlo después en «Tipo de equipo», arriba.</p>');
    var first = $('dlgB').querySelector('[data-d=pick]'); if (first) first.focus();
  }
  function revealRow(r) {
    SECS.forEach(function (s, i) { var g = secRange(i); if (r >= s.hr && r <= g[1] && folded[s.n]) { setFold(i, false); refreshSums(); } });
  }
  function goRow(r, focus) {
    revealRow(+r);
    var tr = $('r' + r), sh = $('sheet'), th = sh.querySelector('thead');
    if (tr) sh.scrollTop = tr.offsetTop - th.offsetHeight - 2;
    if (focus && $('c_' + focus)) $('c_' + focus).focus({ preventScroll: true });
  }

  /* ---------- Diálogos ---------- */
  function showDialog(title, html) { $('dlgT').textContent = title; $('dlgB').innerHTML = html; if (!$('dlg').open) $('dlg').showModal(); }
  function closeDialog() {
    $('dlg').close();
    if (pendingRestore) { var el = pendingRestore, c = el.getAttribute('data-c'); pendingRestore = null; el.value = vals[c] || ''; grow(el); el.focus(); }
  }
  $('dlg').addEventListener('close', function () { paintSeg(); chooser = null; $('dlgX').hidden = false; if (pendingRestore) closeDialog(); });
  $('dlg').addEventListener('cancel', function (e) { if (chooser === 'inicio') e.preventDefault(); });
  $('dlgX').onclick = closeDialog;
  function drawDrafts() {
    var ids = Object.keys(drafts).sort(function (a, b) { return drafts[b].upd.localeCompare(drafts[a].upd); });
    showDialog('Borradores en este navegador', '<p style="margin:0 0 6px"><button class="pri" data-d="new">Nuevo borrador</button></p>' + ids.map(function (id) {
      var d = drafts[id];
      return '<div class="dr"><div><b>' + h(draftName(d.v)) + '</b><small>' + tagModo(d.modo) + (id === cur ? 'Abierto · ' : '') + new Date(d.upd).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) + '</small></div><div class="acts">' +
        (id === cur ? '' : '<button data-d="open" data-id="' + id + '">Abrir</button>') +
        '<button data-d="dup" data-id="' + id + '" title="Copia para otro equipo del mismo cliente">Duplicar</button>' +
        '<button data-d="del" data-id="' + id + '">Eliminar</button></div></div>';
    }).join('') + '<p class="note">Los datos se quedan en este navegador: no se envían a ningún servidor. Si limpias sus datos se pierden; guarda un JSON de lo importante o para pasar a otro equipo.</p>');
  }
  function drawGenerate() {
    compute();
    var is = issues(), n = { err: 0, fal: 0, rev: 0 };
    is.forEach(function (i) { n[i.lv]++; });
    var list = is.map(function (i) { return '<li><button data-d="go" data-row="' + i.r + '">Fila ' + i.r + ' · ' + h(i.label) + ' — <span class="' + i.lv + '">' + h(i.st) + '</span></button></li>'; }).join('');
    showDialog('Generar master_captura.xlsx', '<p class="sum">' + n.err + ' errores · ' + n.fal + ' faltantes · ' + n.rev + ' por revisar</p>' +
      (nuevo() ? '<p class="note" style="margin:0 0 8px">Equipo nuevo sin pruebas: el Excel lleva solo los datos que importa el Motor; las demás celdas van en blanco.</p>' : '') +
      (n.err ? '<p class="e">Corrige los errores para generar el Excel.</p>' : (n.fal || n.rev) ? '<div class="warnbox"><b>Advertencia: la captura no está completa.</b>Si generas el Excel ahora, los pendientes quedarán marcados en la columna «Revisión» y la macro los encontrará al importar.</div>' : '') +
      '<button class="pri" data-d="gen"' + (n.err ? ' disabled' : '') + '>' + (!n.err && (n.fal || n.rev) ? 'Generar de todos modos' : 'Generar Excel') + '</button>' + (list ? '<ul class="iss">' + list + '</ul>' : ''));
  }
  $('dlgB').addEventListener('click', function (e) {
    var t = e.target.closest('button[data-d]');
    if (!t) return;
    var a = t.getAttribute('data-d'), id = t.getAttribute('data-id'), n;
    if (a === 'closeErr') closeDialog();
    if (a === 'modoOK') { $('dlg').close(); setModo(t.getAttribute('data-m')); return; }
    if (a === 'modoNo') { $('dlg').close(); paintSeg(); return; }
    if (a === 'pick') {
      var pm = normModo(t.getAttribute('data-m')), was = chooser;
      $('dlg').close();
      if (was === 'nuevo') { n = uid(); drafts[n] = { id: n, upd: new Date().toISOString(), v: {}, modo: pm }; openDraft(n); }
      else { modo = pm; setModoUI(); refresh(); saveNow(); }
      return;
    }
    if (a === 'new') { drawChooser(true); return; }
    if (a === 'open') { $('dlg').close(); openDraft(id); }
    if (a === 'dup') {
      showDialog('Duplicar borrador', '<div class="warnbox"><b>Se copiará todo, también las mediciones del equipo original.</b>Antes de generar el Excel, actualiza TAG, serie, espesores, evidencia de material y fechas del nuevo equipo.</div><p style="margin:0">' + h(draftName(drafts[id].v)) + '</p><div class="btns"><button class="pri" data-d="dupOK" data-id="' + id + '">Duplicar</button><button data-d="dupNo">Cancelar</button></div>');
      return;
    }
    if (a === 'dupNo') { drawDrafts(); return; }
    if (a === 'dupOK') { n = uid(); drafts[n] = { id: n, upd: new Date().toISOString(), v: JSON.parse(JSON.stringify(drafts[id].v)), modo: drafts[id].modo }; $('dlg').close(); openDraft(n); toast('Copia creada. Actualiza TAG, serie y mediciones del nuevo equipo.'); }
    if (a === 'del') {
      if (t.getAttribute('data-sure') !== '1') { t.setAttribute('data-sure', '1'); t.textContent = '¿Seguro?'; t.classList.add('danger'); return; }
      delete drafts[id];
      if (id === cur) {
        var rest = Object.keys(drafts);
        if (rest.length) cur = rest[0]; else { cur = uid(); drafts[cur] = { id: cur, upd: new Date().toISOString(), v: {} }; }
        writeStore(); vals = MC.fromDraft(drafts[cur].v).vals; modo = normModo(drafts[cur].modo); setModoUI(); fillAll();
      } else writeStore();
      drawDrafts();
    }
    if (a === 'go') {
      var r = t.getAttribute('data-row'), rr = MC.rowOf[r], target = 'D' + r;
      if (rr && rr.cells) Object.keys(rr.cells).some(function (cc) { if (!(vals[cc + r] || '').trim()) { target = cc + r; return true; } });
      $('dlg').close(); goRow(r, target);
    }
    if (a === 'gen') {
      saveNow();
      download('master_captura_' + baseName() + '.xlsx', MC.buildXlsx(effVals()), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      $('dlg').close(); toast('Excel generado.');
    }
  });
  $('bExpand').onclick = function () { foldAll(false); };
  $('bCollapse').onclick = function () { commitActive(); if (!pendingRestore) foldAll(true); };
  $('bSave').onclick = saveJSON;
  $('bOpen').onclick = function () { $('file').value = ''; $('file').click(); };
  $('file').onchange = function () { if (this.files[0]) openJSON(this.files[0]); };
  $('bGen').onclick = function () { commitActive(); if (!pendingRestore) drawGenerate(); };
  $('bDrafts').onclick = function () { commitActive(); if (pendingRestore) return; saveNow(); syncStore(); drawDrafts(); };
  $('jump').onchange = function () { if (this.value) goRow(+this.value); this.value = ''; };
  window.addEventListener('beforeunload', function () { commitActive(); if (saveT) saveNow(); });

  /* ---------- Otra pestaña abierta: el navegador libera el candado solo al cerrarla ---------- */
  (function () {
    if (!navigator.locks || !navigator.locks.request) return;
    var name = 'mc_tab_' + uid();
    navigator.locks.request(name, function () { return new Promise(function () {}); });
    function check() {
      navigator.locks.query().then(function (q) {
        $('tabbar').hidden = q.held.filter(function (l) { return l.name.indexOf('mc_tab_') === 0; }).length < 2;
      });
    }
    setInterval(check, 3000);
    document.addEventListener('visibilitychange', check);
    setTimeout(check, 300);
  })();

  /* ---------- Arranque ---------- */
  readStore();
  if (!storageOK) $('warnbar').hidden = false;
  if (!cur || !drafts[cur]) {
    var ids = Object.keys(drafts).sort(function (a, b) { return drafts[b].upd.localeCompare(drafts[a].upd); });
    cur = ids[0] || uid();
    if (!drafts[cur]) drafts[cur] = { id: cur, upd: new Date().toISOString(), v: {} };
    writeStore();
  }
  vals = MC.fromDraft(drafts[cur].v).vals;
  modo = normModo(drafts[cur].modo);
  renderSheet();
  initFolds();
  setModoUI();
  fillAll();
  if (!drafts[cur].modo && draftVacio(drafts[cur])) drawChooser(false);
})();
</script>
</body>
</html>
